[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "agent-auth-demo-project"
version = "0.1.0"
description = "Multi-Agent Code Review & Security Audit — powered by agent_auth_sdk and OpenAI-compatible LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.0.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0",
  "pytest>=8.3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "shared"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
